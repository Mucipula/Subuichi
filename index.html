<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monte um Sub Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-texture"></div>
  <main class="container">
    <header class="header">
      <div class="eyebrow">Monte um sub Quiz</div>
      <h1>Monte seu Sub.<br><em>Descubra quem você é.</em></h1>
      <p>Suas escolhas de sanduíche dizem mais sobre você.</p>
    </header>

    <section id="quiz" aria-live="polite"></section>

    <div class="footer">Não afiliado ao Subway®</div>
  </main>

  <div id="limitHint" class="limit-hint" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
